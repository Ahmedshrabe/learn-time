<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>It’s Learn Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* opened as a file or in a sandboxed preview, the page may have no web storage; give it an in-memory one so Firebase can still connect */
(function(){ for(const k of ["localStorage","sessionStorage"]){ try{ window[k].getItem("x"); continue; }catch(e){}
  const m=new Map(); try{ Object.defineProperty(window,k,{configurable:true,value:{getItem:x=>m.has(x)?m.get(x):null,setItem:(x,v)=>m.set(x,String(v)),removeItem:x=>m.delete(x),clear:()=>m.clear(),key:i=>[...m.keys()][i]??null,get length(){return m.size}}}); }catch(e){} } })();
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --ink:#111216; --ink-2:#3B3D45; --muted:#6E717C; --num:#9B9EAA; --line:#E7E7EC; --soft:#F6F6F8; --soft-2:#F1F1F3;
  --brand:#5B3DF5; --brand-2:#4A2DE0; --brand-tint:#EFECFF;
  --ok:#58B55A; --ok-ink:#3E8E40; --ok-bg:#F0FBF0; --no:#D9463E; --no-bg:#FCEFEE;
  --y:#F2C94C; --b:#4F8EF7; --r:#EB5757;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --ar:"IBM Plex Sans Arabic","Inter",sans-serif;
  --ease-out:cubic-bezier(0,.55,.45,1); --ease-in:cubic-bezier(.55,0,1,.45); --ease-expo:cubic-bezier(.16,1,.3,1); --ease-back:cubic-bezier(.34,1.56,.64,1); --ease-inout:cubic-bezier(.65,0,.35,1);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; background:#ECECEF; color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; overflow:hidden}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand); outline-offset:3px; border-radius:10px}
h1,h2,h3{margin:0; letter-spacing:-.02em}
.hidden{display:none!important}

#stage{position:absolute; left:50%; top:50%; width:1600px; height:900px; transform-origin:center; overflow:hidden; background:#fff}
.slide{position:absolute; inset:0; padding:80px 96px; opacity:0; visibility:hidden}  /* the old slide leaves at once, so two slides never overlap */
.slide.on{opacity:1; visibility:visible; transition:opacity .3s var(--ease-out)}
.slide.on [data-in]{animation:rise .45s var(--ease-out) both; animation-delay:calc(var(--dl,0)*60ms)}
@keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}

/* typed titles: letters appear one by one, then a short caret blinks and goes */
.big .w{display:inline-block; white-space:nowrap}
.slide.on .big .ch{animation:typein .12s ease-out both; animation-delay:calc(var(--i)*38ms + 120ms)}
@keyframes typein{from{opacity:0}}
.big .caret{display:inline-block; width:.07em; height:.8em; margin-left:.08em; border-radius:3px; background:var(--brand); vertical-align:-.02em; opacity:0}
.slide.on .big .caret{animation:caret 1.4s steps(1) forwards; animation-delay:calc(var(--i)*38ms + 160ms)}
@keyframes caret{0%,30%,70%{opacity:1} 15%,50%,100%{opacity:0}}
/* illustrations: parts pop in, then the drawing floats gently */
.art .pop{transform-box:fill-box; transform-origin:center}
.slide.on .art .pop{animation:pop .8s var(--ease-back) both; animation-delay:calc(var(--i)*280ms + 600ms)}
@keyframes pop{from{opacity:0; transform:scale(.8)}}
.slide.on .side .art svg{animation:float 8s ease-in-out 2.6s infinite}
@keyframes float{50%{transform:translateY(-6px)}}

/* shared lesson-page pieces */
.crumb{font-size:20px; color:var(--muted); display:flex; gap:12px}
.crumb span:not(:last-child)::after{content:"/"; margin-left:12px; color:#C3C5CC}
.big{font-size:84px; font-weight:800; line-height:1.02; letter-spacing:-.035em; margin-top:18px}
.desc{font-size:28px; line-height:1.45; color:var(--muted); margin:24px 0 0; max-width:880px}
.meta{display:flex; gap:32px; margin-top:32px; font-size:22px; color:var(--muted)}
.meta span{display:inline-flex; align-items:center; gap:10px}
.meta svg{width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.8}
.actions{display:flex; align-items:center; gap:18px; margin-top:40px; padding-bottom:48px; border-bottom:1.5px solid var(--line)}
.btn{border:0; background:var(--brand); color:#fff; border-radius:14px; height:64px; padding:0 30px; font-size:22px; font-weight:600; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18); display:inline-flex; align-items:center; gap:10px; text-decoration:none; transition:background .2s var(--ease-out), transform .1s var(--ease-out)}
.btn:hover{background:var(--brand-2)}
.btn:active{transform:scale(.95)}
.lesson{display:grid; grid-template-columns:1fr 520px; gap:72px; height:100%; align-items:center}  /* both columns sit on the slide’s vertical centre */
.side{border:1.5px solid var(--line); border-radius:28px; padding:14px; display:flex; flex-direction:column; align-self:center}
.side .art{background:var(--soft); border-radius:20px; height:270px; display:grid; place-items:center}
.side .art svg{width:200px; height:200px}
.side h3{font-size:20px; font-weight:700; color:var(--ink-2); margin:22px 18px 4px}
.side ul{list-style:none; margin:0; padding:0 18px}
.side li{font-size:19px; color:var(--muted); padding:9px 0; display:flex; justify-content:space-between; gap:12px}
.side li b{font-weight:500; color:var(--num)}
.side .foot{margin:14px 18px 8px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:18px; color:var(--muted)}
.side .foot svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8}
.body{font-size:26px; line-height:1.6; color:var(--ink-2); margin-top:40px; max-width:900px}
.body p{margin:0 0 16px}
.body u{text-decoration:none; border-bottom:2px solid var(--line)}

.slide.mid{display:flex; flex-direction:column; justify-content:center}
/* courses */
.ctitle{display:flex; align-items:center; gap:30px}
.ctitle .big{margin-top:10px}
.stamp{flex:none; width:150px; height:150px}
.stamp svg{width:100%; height:100%; display:block; transform:rotate(-10deg)}
.cgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:40px}
.cc{border:1.5px solid var(--line); border-radius:24px; padding:24px 26px; text-decoration:none; color:var(--ink); display:flex; flex-direction:column; min-height:236px; background:#fff; transition:border-color .2s var(--ease-out), transform .2s var(--ease-out), box-shadow .2s var(--ease-out)}
.cc:hover{border-color:var(--brand); transform:translateY(-6px); box-shadow:0 18px 36px -20px rgba(91,61,245,.55)}
.cc .ch{display:flex; align-items:center; gap:12px}
.cc .logo{width:56px; height:56px; border-radius:50%; border:1.5px solid var(--line); background:#fff; display:grid; place-items:center; overflow:hidden; flex:none}
.cc .logo img{width:36px; height:36px; object-fit:contain}
.cc .logo.fill img{width:100%; height:100%; object-fit:cover}
.cc .pl{flex:1; font-size:19px; font-weight:800; color:var(--ink); text-transform:uppercase; letter-spacing:.02em}
.cc .ch svg{width:22px; height:22px; fill:none; stroke:var(--num); stroke-width:2; transition:stroke .2s}
.cc:hover .ch svg{stroke:var(--brand)}
.cc h3{font-size:27px; margin-top:18px; line-height:1.2}
.cc p{display:flex; align-items:center; gap:8px; font-size:18px; color:var(--muted); margin:8px 0 0}
.cc p svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; flex:none}
.cc .tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:18px}
.tag{font-size:15px; font-weight:600; padding:6px 12px; border-radius:999px; background:var(--soft-2); color:var(--ink-2)}
.tag.p{background:var(--brand-tint); color:var(--brand)} .tag.g{background:var(--ok-bg); color:var(--ok-ink)}
.thanks{align-items:center; text-align:center}
.hostcard{height:110px; width:auto; margin-top:64px}
.thanks .art svg{width:200px; height:200px}
.thanks .big{font-size:120px; margin-top:8px}
.thanks .desc{max-width:none}
/* intro */
.rounds{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:40px; max-width:900px}
.rd{border:1.5px solid var(--line); border-radius:22px; padding:22px 24px}
.rd .n{font-size:16px; font-weight:700; color:var(--brand); text-transform:uppercase; letter-spacing:.06em}
.rd h3{font-size:26px; margin-top:8px}
.rd p{font-size:19px; color:var(--muted); line-height:1.5; margin:8px 0 0}

/* live: join + podium */
.av svg{width:100%; height:100%; display:block}
.jcard{border:1.5px solid var(--line); border-radius:28px; padding:28px; display:flex; flex-direction:column; align-items:center; align-self:center; text-align:center}
.jcard .qr{width:328px; height:328px; border-radius:24px}
.jcard .qr img,.jcard .qr canvas{width:300px!important; height:300px!important}
.jcard .lbl{font-size:18px; color:var(--muted); margin-top:22px}
.jcard .code{font-size:72px; font-weight:800; letter-spacing:.12em; line-height:1.1; margin-top:2px}
.jcard .url{font-size:17px; color:var(--muted); margin-top:8px; word-break:break-all}
.lob{display:flex; flex-wrap:wrap; gap:12px; margin-top:32px; max-height:250px; overflow:hidden; align-content:flex-start}
.chip{display:inline-flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:999px; padding:6px 18px 6px 6px; font-size:20px; font-weight:500; animation:rise .3s ease-out}
.chip .av{width:44px; height:44px}
.chip em{font-style:normal; color:var(--num); font-weight:600; margin-left:10px}
.chip b{color:var(--muted); font-weight:600; margin-left:6px}
.note{font-size:21px; color:var(--muted); line-height:1.5; margin:0}
.pod{display:grid; grid-template-columns:repeat(3,280px); justify-content:center; align-items:end; gap:28px; margin-top:34px}
.pc{display:flex; flex-direction:column; align-items:center; text-align:center}
.pc .av{width:116px; height:116px}
.pc b{font-size:26px; margin-top:10px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pc>span:not(.av){font-size:19px; color:var(--muted); margin-top:2px}
.pc .blk{width:100%; margin-top:14px; border-radius:22px 22px 0 0; border-top:10px solid; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff}
.pc .blk em{font-style:normal; font-size:56px; font-weight:800; line-height:1; letter-spacing:-.03em}
.pc .blk small{font-size:18px; font-weight:600; opacity:.85; margin-top:4px; text-transform:uppercase; letter-spacing:.08em}
.pc.p1 .blk{height:240px; background:var(--brand); border-color:#F2C94C} .pc.p2 .blk{height:180px; background:#8C78F8; border-color:#D5D8DE} .pc.p3 .blk{height:130px; background:#BDB1FB; border-color:#E8A87C}
.pc .crown{width:64px; height:44px; margin-bottom:-6px}
.pc.p1 .av{width:136px; height:136px}
.pc.empty{visibility:hidden}
.rest{display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:22px}
.ansd{color:var(--ink-2); font-weight:600}
.cnt{font-style:normal; font-size:16px; font-weight:600; color:var(--muted); background:var(--soft-2); border-radius:999px; padding:4px 12px; white-space:nowrap}

/* question (Uxcel) */
.q{padding:40px 260px 150px}
.qtop{display:flex; align-items:center; gap:28px; height:40px}
.qtop button{border:0; background:none; padding:4px; color:#55575F; display:grid; place-items:center}
.qtop svg{width:26px; height:26px; stroke:currentColor; stroke-width:2; fill:none}
.qtop .dots svg{width:26px; height:8px; fill:currentColor; stroke:none}
.bar{flex:1; height:10px; border-radius:99px; background:var(--soft-2); overflow:hidden}
.bar i{display:block; height:100%; background:var(--ink); border-radius:99px; transform-origin:left; transition:transform .6s}
.qmeta{display:flex; justify-content:center; gap:16px; margin-top:40px; font-size:16px; color:var(--num)}
.qmeta button{border:0; background:none; color:inherit; padding:0; display:inline-flex; align-items:center; gap:6px; font-size:16px}
.qmeta svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2}
.qmeta .low{color:var(--no)} .qmeta .run{color:var(--ink)}
.hq{font-size:32px; font-weight:700; text-align:center; margin:12px auto 0; max-width:1050px; line-height:1.3; letter-spacing:-.01em}
.qb{display:grid; gap:40px; margin:36px auto 0; max-width:1000px}
.qb.split{grid-template-columns:520px 1fr; max-width:1080px}
.qimg{border:1px solid var(--line); border-radius:20px; overflow:hidden; background:#fff; align-self:start}
.qimg img{display:block; width:100%}
.rows{display:grid; gap:16px; align-content:start}
.orow{display:flex; align-items:center; gap:16px; width:100%; text-align:left; border:1.5px solid var(--line); background:#fff; border-radius:18px; padding:20px 26px; min-height:76px; font-size:22px; line-height:1.35; transition:border-color .2s, background .2s, color .2s}
.orow .t{flex:1} .orow .n{color:var(--num); font-size:19px}
.orow:hover{border-color:#C9CAD1}
.slide.on .orow,.slide.on .pk{animation:rise .35s var(--ease-out) both; animation-delay:calc(var(--dl)*40ms + 120ms)}
.picks{display:grid; grid-template-columns:1fr 1fr; gap:28px}
.pk{border:0; background:none; padding:0; text-align:left}
.pk .im{border:2px solid var(--line); border-radius:20px; overflow:hidden; background:#fff; transition:border-color .2s}
.pk img{display:block; width:100%; max-height:380px; object-fit:contain}
.pk .n{display:block; color:var(--num); font-size:19px; padding:10px 4px 0}
.pk:hover .im{border-color:#C9CAD1}
.rev .orow,.rev .pk{pointer-events:none}
.rev .orow:not(.right):not(.wrong){color:#8A8B94; border-color:#F0F0F2}
.rev .orow.right{border:3px solid var(--ok); background:var(--ok-bg); padding:18px 24px; color:var(--ink)} .rev .orow.right .n{color:var(--ok-ink)}
.rev .orow.wrong{border:3px solid var(--no); background:var(--no-bg); padding:18px 24px; color:var(--ink)} .rev .orow.wrong .n{color:var(--no)}
.rev .pk.right .im{border:3px solid var(--ok)} .rev .pk.right .n{color:var(--ok-ink)}
.rev .pk.wrong .im{border:3px solid var(--no)} .rev .pk:not(.right):not(.wrong){opacity:.5}
.qfoot{position:absolute; left:0; right:0; bottom:0; height:124px; border-top:1px solid #EBEBEF; background:#fff; display:flex; align-items:center; gap:20px; padding:0 260px; transition:background .3s}
.qfoot .sp{flex:1}
.status{display:none; align-items:center; gap:10px; border:3px solid currentColor; border-radius:999px; padding:8px 22px 8px 10px; font-weight:600; font-size:22px; background:#fff}
.status i{width:32px; height:32px; border-radius:50%; background:currentColor; display:grid; place-items:center}
.status svg{width:18px; height:18px; stroke:#fff; stroke-width:3; fill:none}
.tlink{display:none; border:0; background:none; color:#55575F; font-size:22px; font-weight:600; padding:10px 6px}
.idk{border:1.5px solid var(--line); background:#fff; border-radius:14px; padding:12px 20px; font-size:18px; font-weight:500}
.cont{border:0; background:var(--soft-2); color:#C2C3CA; border-radius:16px; height:60px; padding:0 30px; font-size:22px; font-weight:600; cursor:default}
.rev .qfoot{border-color:transparent} .rev .idk{display:none} .rev .status,.rev .tlink{display:inline-flex}
.rev .cont{cursor:pointer; color:#fff}
.rev.good .qfoot,.rev.neutral .qfoot{background:var(--ok-bg)} .rev.good .status,.rev.neutral .status{color:var(--ok)} .rev.good .cont,.rev.neutral .cont{background:var(--ok)}
.rev.bad .qfoot{background:var(--no-bg)} .rev.bad .status{color:var(--no)} .rev.bad .cont{background:var(--no)}

/* theory panel */
.ovl{position:absolute; inset:0; background:rgba(17,18,22,.35); z-index:20; display:none; align-items:center; justify-content:center}
.ovl.show{display:flex; animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{width:960px; background:#fff; border-radius:28px; padding:36px 40px 40px; box-shadow:0 30px 80px -20px rgba(0,0,0,.35); animation:rise .25s ease-out}
.dlg .top{display:flex; align-items:center; gap:16px}
.dlg .top h2{font-size:30px; font-weight:700; flex:1}
.dlg .x{border:0; background:var(--soft-2); width:44px; height:44px; border-radius:50%; display:grid; place-items:center}
.dlg .x svg{width:20px; height:20px; stroke:var(--ink); stroke-width:2; fill:none}
.ans{margin-top:18px; border:3px solid var(--ok); background:var(--ok-bg); border-radius:18px; padding:16px 22px; font-size:22px; display:flex; justify-content:space-between; gap:16px}
.ans span{color:var(--ok-ink); font-weight:600; white-space:nowrap}
.seg{display:inline-flex; background:var(--soft-2); border-radius:12px; padding:4px; margin-top:22px}
.seg button{border:0; background:transparent; border-radius:9px; padding:9px 20px; font-size:17px; font-weight:600; color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pane{margin-top:18px; font-size:24px; line-height:1.6; color:var(--ink-2)}
.pane p{margin:0 0 14px}
.pane .trap{font-size:20px; background:var(--soft); border-radius:14px; padding:16px 20px; color:var(--ink-2)}
.pane .trap b{color:var(--ink)}
.pane.ar{direction:rtl; text-align:right; font-family:var(--ar); line-height:1.85}

/* section break */
.brk{display:grid; grid-template-columns:1fr 520px; gap:72px; height:100%; align-items:center}
.count{font-size:22px; font-weight:600; color:var(--brand)}
/* KPI: goal card + a three-stop path */
.kh{display:grid; grid-template-columns:1fr 340px; gap:56px; align-items:center}
.team{background:var(--brand-tint); border-radius:28px; padding:22px 24px; text-align:center}
.crowd{display:grid; grid-template-columns:repeat(5,44px); gap:8px; justify-content:center}
.crowd .av{width:44px; height:44px}
.slide.on .crowd .av{animation:pop .5s var(--ease-back) both; animation-delay:calc(var(--r)*70ms + 300ms)}
.team p{margin:14px 0 0; font-size:17px; line-height:1.45; color:var(--ink-2)} .team p b{color:var(--brand)}
.track{position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:40px}
.track::before{content:""; position:absolute; left:28px; right:28px; top:26px; border-top:3px dashed #C9CAD1}
.tk{position:relative; display:flex; flex-direction:column}
.tk .dot{width:54px; height:54px; border-radius:50%; background:#fff; border:3px solid var(--ink); display:grid; place-items:center; font-size:19px; font-weight:800; position:relative; z-index:1}
.tk.main .dot{background:var(--brand); border-color:var(--brand); color:#fff}
.tc{margin-top:16px; flex:1; border:1.5px solid var(--line); border-radius:24px; padding:28px 30px; display:flex; flex-direction:column; background:#fff}
.tk.main .tc{border:3px solid var(--brand); background:var(--brand-tint); padding:26.5px 28.5px}
.ask{display:flex; align-items:center; gap:14px; margin:34px 0 0; font-size:28px; font-weight:700; letter-spacing:-.01em}
.ask svg{width:34px; height:34px; flex:none; fill:none; stroke:var(--brand); stroke-width:1.8}
.tc h3{font-size:32px; line-height:1.15}
.tc p{font-size:21px; color:var(--muted); line-height:1.5; margin:10px 0 0}
.qr{background:#fff; border:1.5px solid var(--line); border-radius:20px; padding:12px; width:240px; height:240px; display:grid; place-items:center}
.qr img,.qr canvas{width:214px!important; height:214px!important}

/* presenter nav */
.side .qr img,.side .qr canvas{width:104px!important; height:104px!important}
/* AI course slide: QR tile inside the side card */
.side .foot:has(> .scan){display:block; margin:12px 0 0}
.scan{display:flex; align-items:center; gap:20px; background:var(--soft); border-radius:20px; padding:14px; text-align:left}
.scan .qr{width:120px; height:120px; padding:8px; border-radius:14px; flex:none}
.scan b{display:block; font-size:20px; font-weight:700; color:var(--ink)}
.scan span{display:block; font-size:17px; color:var(--muted); margin-top:4px}
#nav{position:absolute; right:28px; bottom:22px; display:flex; align-items:center; gap:6px; z-index:15; background:#fff; border:1px solid var(--line); border-radius:999px; padding:4px; opacity:.35; transition:opacity .2s}
#nav:hover,#nav:focus-within{opacity:1}

const points=(ok,ms,lim,streak=1)=>{ if(!ok||ms>lim*1000+1500) return 0;

/* wrap a title's letters for the typing effect; words stay unbroken, <br> stays, screen readers get the plain title */
function typeify(h){ let i=0; h.setAttribute("aria-label",h.textContent);
  const walk=node=>[...node.childNodes].forEach(c=>{
    if(c.nodeType===3){ const frag=document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(part=>{ if(!part) return; if(/^\s+$/.test(part)){ frag.append(part); i++; return; }
        const w=document.createElement("span"); w.className="w"; w.setAttribute("aria-hidden","true");
        [...part].forEach(ch=>{ const sp=document.createElement("span"); sp.className="ch"; sp.style.setProperty("--i",i++); sp.textContent=ch; w.append(sp); });
        frag.append(w); });
      c.replaceWith(frag); }
    else if(c.nodeType===1&&c.tagName!=="BR") walk(c); });
  walk(h); const k=document.createElement("span"); k.className="caret"; k.setAttribute("aria-hidden","true"); k.style.setProperty("--i",i); h.append(k); }
const MOTION="[data-in], .big .ch, .big .caret, .art .pop, .crowd .av";

/* live play: phones join a room, answer on their own screen, the deck scores and reveals */
let room=null, liveOk=false, players={}, scores={}, ansOff=null;
function joinUrl(){ const base=PLAY_BASE||(/^https?:$/.test(location.protocol)?new URL("play.html",location.href).href:"");
  return base&&room?`${base}${base.includes("?")?"&":"?"}r=${room}`:""; }
async function liveStart(){
  liveOk=await liveInit();
  if(liveOk){ let c=null; try{ c=sessionStorage.getItem("lt:room"); }catch(e){}
    for(let i=0;i<5&&!room;i++){ c=c||String(1000+Math.floor(Math.random()*9000));
      try{ await roomRef(c,"host").set(fuid); room=c; }catch(e){ c=null; } }
    liveOk=!!room; }
  if(liveOk){ try{ sessionStorage.setItem("lt:room",room); }catch(e){}
    roomRef(room,"players").on("value",s=>{ players=s.val()||{}; renderLive(); });
    roomRef(room,"scores").on("value",s=>{ scores=s.val()||{}; renderLive(); });
    pushState(); if(slides[cur].dataset.q&&!slides[cur].classList.contains("rev")) startT(slides[cur]); }
  renderLive();
}
function renderLive(){
  const lob=document.getElementById("lob"); if(!lob) return;
  const r=ranking(players,scores), url=joinUrl(), qr=document.getElementById("qrJoin"), chip=(p,pre="",post="")=>`<span class="chip">${pre}<span class="av">${avatar(p.av)}</span>${esc(p.name)}${post}</span>`;
  document.getElementById("lobN").textContent=r.length;
  if(!liveOk){ lob.innerHTML=`<p class="note">${{sdk:"Couldn’t load Firebase. Check the internet connection and reload.",config:"Live play is off: add the Firebase config in src/live-config.js and rebuild."}[liveWhy]||`Couldn’t connect to Firebase (${esc(liveWhy)}). Reload, or double-click <b>present.command</b> in the learn-time folder.`}</p>`; qr.innerHTML=""; qr.dataset.u="";
    document.getElementById("roomCode").textContent="––––"; document.getElementById("joinUrl").textContent=""; }
  else{ lob.innerHTML=r.map(p=>chip(p)).join("")||`<p class="note">Waiting for the first player…</p>`;
    document.getElementById("roomCode").textContent=room;
    document.getElementById("joinUrl").textContent=url?url.replace(/^https?:\/\//,""):"Set PLAY_BASE in src/live-config.js to show the code";
    if(url&&qr.dataset.u!==url){ qr.innerHTML=""; qr.dataset.u=url; try{ new QRCode(qr,{text:url,width:300,height:300,colorDark:"#111216",colorLight:"#ffffff"}); qr.removeAttribute("title"); }catch(e){} } }
  const pod=document.getElementById("pod"), rest=document.getElementById("rest");
  if(!r.length){ pod.innerHTML=`<p class="note" style="grid-column:1/-1;text-align:center">Scores show up here once phones join.</p>`; rest.innerHTML=""; }
  else{ const place=["1st","2nd","3rd"];
    pod.innerHTML=[1,0,2].map(i=>r[i]?`<div class="pc p${i+1}">${i===0?I.crown:""}<span class="av">${avatar(r[i].av)}</span><b>${esc(r[i].name)}</b><span>${r[i].pts} pts</span><div class="blk"><em>${place[i]}</em><small>place</small></div></div>`:`<div class="pc p${i+1} empty"></div>`).join("");
    rest.innerHTML=r.slice(3,11).map((p,i)=>chip(p,`<em>${i+4}</em>`,`<b>${p.pts}</b>`)).join(""); }
}
function pushState(){ if(!liveOk) return; const s=slides[cur];
  if(ansOff){ ansOff(); ansOff=null; }
  let st={ph:"wait"};
  if(s.dataset.q){ const q=s._q;
    if(s.classList.contains("rev")) st={ph:"rev",qi:s._qi,c:q.c,pos:s._pos};
    else{ st={ph:"q",qi:s._qi,lim:LIMIT,at:TS(),q:{q:q.q,t:q.t,o:q.t==="pick"?["Design 1","Design 2"]:q.o,pos:s._pos}};
      /* phones get the pictures too: one illustration, or the two designs as the answer buttons */
      if(q.t==="img") st.q.img=IMG[q.img]; else if(q.t==="pick") st.q.imgs=[IMG[q.img+"_0"],IMG[q.img+"_1"]];
      const r=roomRef(room,"answers/"+s._qi), h=r.on("value",a=>{ const n=a.numChildren(), tot=Object.keys(players).length;
        s.querySelector(".ansd").textContent=tot?`· ${n} / ${tot} answered`:"";
        if(tot&&n>=tot&&!s.classList.contains("rev")) check(s); });
      ansOff=()=>r.off("value",h); } }
  else if(s.dataset.live==="pod") st={ph:"pod"};
  roomRef(room,"state").set(st).catch(e=>console.warn(e));
}
async function liveReveal(s){ if(ansOff){ ansOff(); ansOff=null; } const qi=s._qi, c=+s.dataset.c;
  try{ const [a,t]=await Promise.all([roomRef(room,"answers/"+qi).once("value"),roomRef(room,"state/at").once("value")]);
    const ans=a.val()||{}, t0=t.val()||0, cnt={}, up={};
    Object.entries(ans).forEach(([id,x])=>{ cnt[x.k]=(cnt[x.k]||0)+1; up[`${id}/${qi}`]=points(x.k===c,x.at-t0,LIMIT,streakAt(scores[id],qi-1)+1); });
    if(Object.keys(up).length) await roomRef(room,"scores").update(up);
    s.querySelectorAll(".cnt").forEach(e=>e.remove());
    s.querySelectorAll("[data-k]").forEach(o=>{ const n=o.querySelector(".n"); n.insertAdjacentHTML(o.classList.contains("pk")?"beforeend":"beforebegin",`<em class="cnt">${cnt[o.dataset.k]||0} picked</em>`); });
    if(slides[cur]===s) await roomRef(room,"state").set({ph:"rev",qi,c,pos:s._pos});
  }catch(e){ console.warn(e); } }

/* questions */
let tRaf=null, tEnd=null;
function stopT(){ if(tRaf){ cancelAnimationFrame(tRaf); tRaf=null; } clearTimeout(tEnd); tEnd=null; }
function startT(s){ stopT(); const ck=s.querySelector(".clock"); if(!ck) return; const sp=ck.querySelector("span"), t0=performance.now(); ck.classList.add("run");
  if(liveOk) tEnd=setTimeout(()=>check(s),LIMIT*1000+300); /* reveals even if the tab is in the background */
  const step=now=>{ const left=Math.max(0,LIMIT*1000-(now-t0)); sp.textContent=`0:${String(Math.ceil(left/1000)).padStart(2,"0")}`; ck.classList.toggle("low",left<5000); if(left>0) tRaf=requestAnimationFrame(step); else tRaf=null; };
  tRaf=requestAnimationFrame(step); }
function check(s){ if(s.classList.contains("rev")) return; stopT();
  const c=+s.dataset.c, sel=s.querySelector(".sel"), pick=sel?+sel.dataset.k:null;
  s.querySelectorAll("[data-k]").forEach(o=>{ const k=+o.dataset.k; if(k===c) o.classList.add("right"); else if(k===pick) o.classList.add("wrong"); });
  const st=pick===null?"neutral":pick===c?"good":"bad"; s.classList.add("rev",st);
  s.querySelector(".status i").innerHTML=st==="bad"?I.cross:I.check;
  s.querySelector(".st").textContent=st==="good"?"Correct!":st==="bad"?"Incorrect!":"Correct answer";
  s.querySelector(".cont").disabled=false; if(st!=="bad") burst(s.querySelector(".right"));
  if(liveOk) liveReveal(s); }
function openDlg(){ const q=slides[cur]._q; if(!q) return;
  document.getElementById("dlgA").textContent=q.t==="pick"?`Option ${q.c+1}`:q.o[q.c];
  document.getElementById("pEn").innerHTML=`<p>${esc(q.en)}</p><p class="trap"><b>Watch out:</b> ${esc(q.ent)}</p>`;
  document.getElementById("pAr").innerHTML=`<p>${esc(q.ar)}</p><p class="trap"><b>خلي بالك:</b> ${esc(q.art)}</p>`;
  tab("en"); document.getElementById("ovl").classList.add("show"); document.getElementById("dlgX").focus(); }
function closeDlg(){ document.getElementById("ovl").classList.remove("show"); }
function tab(p){ document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===p)); document.getElementById("pEn").classList.toggle("hidden",p!=="en"); document.getElementById("pAr").classList.toggle("hidden",p!=="ar"); }
function burst(el){ if(!el||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r=el.getBoundingClientRect(), sr=stage.getBoundingClientRect(), sc=sr.width/1600, x=(r.left-sr.left+r.width/2)/sc, y=(r.top-sr.top+r.height/2)/sc;
  const cols=["#5B3DF5","#58B55A","#F2C94C","#4F8EF7","#EB5757"];
  for(let i=0;i<18;i++){ const p=document.createElement("i"); p.className="cf"; const a=Math.random()*Math.PI*2, d=130+Math.random()*230;
    p.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%5]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d+140}px;--r:${Math.random()*720-360}deg`;
    stage.appendChild(p); setTimeout(()=>p.remove(),1400); } }
function forward(){ const s=slides[cur]; if(s.dataset.q&&!s.classList.contains("rev")){ check(s); return; } go(cur+1); }
toggleFS=()=>{ document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.().catch(()=>{}); };
host.addEventListener("click",e=>{
  if(e.target.closest("[data-go]")){ go(cur+1); return; }
  const s=e.target.closest(".slide"); if(!s||!s.dataset.q) return;
  const o=e.target.closest(".orow,.pk");
  if(o&&!s.classList.contains("rev")){ o.classList.add("sel"); check(s); return; }
  if(e.target.closest(".clock")) startT(s);
  if(e.target.closest(".idk")) check(s);
  if(e.target.closest(".tlink")) openDlg();
  if(e.target.closest(".cont")&&s.classList.contains("rev")) go(cur+1);
  if(e.target.closest(".xb")) go(cur-1);
  if(e.target.closest(".dots")) toggleFS();
});
document.getElementById("next").onclick=forward;
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("fs").onclick=toggleFS;
document.getElementById("dlgX").onclick=closeDlg;
document.getElementById("ovl").onclick=e=>{ if(e.target.id==="ovl") closeDlg(); };
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>tab(b.dataset.p));
addEventListener("keydown",e=>{
  if(e.target.isContentEditable) return;
  const k=e.key.toLowerCase(), s=slides[cur], ovl=document.getElementById("ovl").classList.contains("show");
  if(k==="escape"&&ovl){ closeDlg(); return; }
  if(k==="arrowright"||k==="pagedown"||((k===" "||k==="enter")&&!e.target.closest("button,[role=button]"))){ e.preventDefault(); if(ovl){ closeDlg(); return; } forward(); }
  else if(k==="arrowleft"||k==="pageup"){ e.preventDefault(); go(cur-1); }
  else if(k==="t"&&s.dataset.q) startT(s);
  else if(k==="w"&&s.classList.contains("rev")) ovl?closeDlg():openDlg();
  else if(k==="a"&&ovl) tab(document.getElementById("pAr").classList.contains("hidden")?"ar":"en");
  else if(["1","2","3","4"].includes(k)&&s.dataset.q&&!s.classList.contains("rev")){ const o=s.querySelector(`[data-k="${+k-1}"]`); if(o) o.click(); }
  else if(k==="f") toggleFS();
});
let tx=null; addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>60) dx<0?forward():go(cur-1); tx=null; });
var toggleFS;
build(false);
liveStart();
</script>
</body>
</html>
